# Databricks Apps Configuration
# Deploy this app to Databricks Apps using the CLI or UI

name: scrap-reduction-intelligence
description: Scrap Reduction Intelligence Platform - Dashboards, What-If Analysis, AI Assistant

# Entry point
command: ["streamlit", "run", "app.py"]

# Environment variables
env:
  - name: ENVIRONMENT
    value: "DBX"
  - name: DATABRICKS_HOST
    value: "fe-vm-industry-solutions-buildathon.cloud.databricks.com"
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/b9637dd46c71dea3"
  - name: DATABRICKS_CATALOG
    value: "scrap_catalog"
  - name: DATABRICKS_SCHEMA
    value: "scrap_demo"
  - name: GENIE_SPACE_ID
    value: "01f0ee7c90c9160b80fd7567dc1e3fca"
  - name: DASHBOARD_EMBED_URL
    value: "https://fe-vm-industry-solutions-buildathon.cloud.databricks.com/embed/dashboardsv3/01f0ee8e089810f5956650e65d9f4836?o=237438879023004"

# Environment variables are automatically set by Databricks Apps runtime
# (DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_WAREHOUSE_ID)

# Resources
resources:
  memory: 2Gi
  cpu: 1

# Health check
health_check:
  path: /_stcore/health
  interval: 30s
  timeout: 10s

