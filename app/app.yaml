# Databricks Apps Configuration
# Deploy this app to Databricks Apps using the CLI or UI

name: scrap-reduction-intelligence
description: Scrap Reduction Intelligence Platform - Dashboards, What-If Analysis, AI Assistant

# Entry point
command: ["streamlit", "run", "app.py"]

# Environment variables (DATABRICKS_HOST is set by Apps runtime; catalog/schema/warehouse path from bundle `config.env`)
env:
  - name: ENVIRONMENT
    value: "DBX"

# SQL auth: runtime injects host + credentials; `data/connection.py` uses SDK `Config()` + SQL connector
# per Databricks Apps Cookbook — https://apps-cookbook.dev/docs/streamlit/tables/tables_read

# Resources
resources:
  memory: 2Gi
  cpu: 1

# Health check
health_check:
  path: /_stcore/health
  interval: 30s
  timeout: 10s

