# Streamlit Configuration
# Optimized for dark mode and Databricks Apps deployment

[theme]
primaryColor = "#6366f1"
backgroundColor = "#0a0a0f"
secondaryBackgroundColor = "#12121a"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[runner]
magicEnabled = true
fastReruns = true

