# Databricks Asset Bundle Configuration
# =====================================
# Scrap Reduction Intelligence Platform
# 
# Deploy: databricks bundle deploy --target dev
# Validate: databricks bundle validate
# Run: databricks bundle run <job_name>

bundle:
  name: scrap-reduction-platform

# Variables that can be overridden per target
variables:
  catalog:
    description: Unity Catalog name
    default: scrap_catalog
  schema:
    description: Schema name for all tables
    default: scrap_demo
  warehouse_id:
    description: SQL Warehouse ID for queries
    default: 288a7ec183eea397
  # Service principal for production deployments
  service_principal_name:
    description: Service principal for running jobs and apps
    default: ""

# Include resource definitions from separate files
include:
  - resources/*.yml

# Workspace settings
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}

# Target environments
# Note: Set DATABRICKS_HOST environment variable or use `databricks auth login`
targets:
  # Development environment
  dev:
    mode: development
    default: true
    variables:
      catalog: scrap_catalog
      schema: scrap_demo
    workspace:
      host: https://fe-vm-industry-solutions-buildathon.cloud.databricks.com
      profile: fe-vm-industry-solutions-buildathon

  # Azure workspace environment
  azure:
    mode: development
    variables:
      catalog: welch
      schema: scrap_demo
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      profile: azure
      root_path: /Workspace/Users/noah.soprala@databricks.com/apps/nsoprala-scrap-demo

  # Staging environment  
